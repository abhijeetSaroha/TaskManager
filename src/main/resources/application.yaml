server:
  port: 8080

spring:
  application:
    name: task-manager-api

  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:task_manager_db
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # Enable the web console to view your database
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA & Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true